name: indicadores

services:
  api:
    container_name: indicadores-api
    image: indicadores-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - convenio

  nginx:
    container_name: indicadores-front
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8082}:80"
    volumes:
      - ../Frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - convenio

networks:
  convenio:
    driver: bridge
